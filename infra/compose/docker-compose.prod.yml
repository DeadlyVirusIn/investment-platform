version: "3.9"

# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# TODO: Before going live:
#   - Store secrets in Docker Secrets or a vault (not .env)
#   - Point POSTGRES_PASSWORD + FERNET_KEY at secret references
#   - Add TLS via ACME (Caddyfile already configured for HTTPS)
#   - Set resource limits (mem_limit / cpus) per service
#   - Enable pg_dump backup cron or use managed Postgres

services:
  # Override api to disable localhost-only port binding
  api:
    ports: []          # not exposed directly; Caddy proxies internally
    restart: always
    mem_limit: 768m    # ~6.7x observed (115M); spikes spill to swap, not OOM

  # Base compose defines TWO worker services — override both by their real
  # names (an orphan `worker:` here would not match either and the daily-loop /
  # restart wiring would never apply).
  worker-tickloop:   # tick-loop scheduler (apps.worker.src.main)
    restart: always
    mem_limit: 512m    # observed 82M
  worker-cron:       # supercronic → scripts/run_daily_loop.sh (03:30 ET, Tue–Sat)
    restart: always
    mem_limit: 1g      # observed 51M at rest; daily pipeline (pandas/ML) spikes

  # Replace the base Vite dev/HMR service with a one-shot static-dist sync.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: arthos-web-dist:prod
    command: ["sh", "-c", "rm -rf /srv/web/* && cp -a /opt/dist/. /srv/web/ && echo 'web dist synced'"]
    # Base-file bind mounts /app and the node_modules volume still merge under
    # compose override semantics. They are harmless: dist lives in /opt/dist.
    volumes:
      - web_dist:/srv/web
    # `!reset` is required: compose merges list keys by union, so a bare
    # `ports: []` would still publish the base file's 127.0.0.1:5173.
    ports: !reset []
    environment: !reset {}
    restart: "no"
    healthcheck:
      disable: true
    mem_limit: 384m    # observed 106M

  db:
    restart: always
    ports: []          # never expose postgres publicly in prod
    mem_limit: 1.25g   # most headroom — query/shared_buffers; swap behind it

  caddy:
    image: caddy:2-alpine
    restart: always
    mem_limit: 256m    # observed 23M; headroom per operator request
    # Site address for the Caddyfile. Set ARTHOS_DOMAIN in the host .env to your
    # real domain (Option A: Caddy ACME HTTPS) or ":80" (Option B: behind
    # Cloudflare TLS). Defaults to ":80" so Caddy never fails on an unset var.
    environment:
      ARTHOS_DOMAIN: ${ARTHOS_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      # Tunnel origin — loopback only. Cloudflare Tunnel (cloudflared-arthos)
      # connects to localhost:8081 -> Caddy ":8081" plain-HTTP site. Not public.
      # Published on BOTH IPv4 and IPv6 loopback: cloudflared resolves "localhost"
      # to ::1 first, so an IPv4-only publish caused connection-refused -> 502.
      - "127.0.0.1:8081:8081"
      - "[::1]:8081:8081"
      # HTTP/3 (443/udp) publish removed: dual TCP+UDP publish on the same port
      # with Docker's userland-proxy caused external TCP-443 SYNs to be RST while
      # 80 worked. TCP-only matches 80; HTTP/2 over TCP is unaffected.
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # The one-shot web service populates this volume from its image build.
      - web_dist:/srv/web:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      # caddy:2-alpine includes BusyBox wget; this site is always local HTTP.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  web_dist:

networks:
  backend:
    driver: bridge
