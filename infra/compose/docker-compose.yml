version: "3.9"

# 2026-05-21 — web service now runs inside compose (`web` below) so
# Vite dev server auto-resumes on PC/restart. Prior design required
# manual `cd apps/web && npm run dev`; that broke continuity every
# reboot. HMR preserved via bind-mount + chokidar polling (already
# enabled in apps/web/vite.config.ts).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TIINGO_API_KEY: ${TIINGO_API_KEY}
      # Phase 11W follow-up — run_engine_pipeline.py calls
      # backfill_macro_features which requires FRED_API_KEY. Without
      # this propagation the daily loop's macro_backfill stage exits
      # rc=2, downstream stages skip, and context_daily / regime /
      # factor / candidate stay stuck behind price_bar.
      FRED_API_KEY: ${FRED_API_KEY}
      FERNET_KEY: ${FERNET_KEY}
      APP_VERSION: ${APP_VERSION:-0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Marker dir mounted from worker-cron volume (read-only).
      SCHEDULER_MARKER_DIR: /var/scheduler_markers
      ML_HYBRID_ENABLED: ${ML_HYBRID_ENABLED:-false}
      ML_HYBRID_MODE: ${ML_HYBRID_MODE:-advisory}
      ML_HYBRID_REQUIRE_CALIBRATION: ${ML_HYBRID_REQUIRE_CALIBRATION:-true}
      ML_HYBRID_REQUIRE_BASELINE_BEAT: ${ML_HYBRID_REQUIRE_BASELINE_BEAT:-true}
      ML_HYBRID_ALLOW_BLOCK: ${ML_HYBRID_ALLOW_BLOCK:-false}
      ML_HYBRID_MIN_CONFIDENCE: ${ML_HYBRID_MIN_CONFIDENCE:-0.65}
      ML_HYBRID_MAX_STALE_DAYS: ${ML_HYBRID_MAX_STALE_DAYS:-7}
      ML_HYBRID_MIN_DATA_CONFIDENCE: ${ML_HYBRID_MIN_DATA_CONFIDENCE:-0.70}
      ML_HYBRID_MIN_MULTIPLIER: ${ML_HYBRID_MIN_MULTIPLIER:-0.50}
      ML_PROMOTION_MIN_ADVICE: ${ML_PROMOTION_MIN_ADVICE:-20}
      ML_PROMOTION_MIN_OUTCOMES: ${ML_PROMOTION_MIN_OUTCOMES:-20}
      ML_PROMOTION_MAX_ECE: ${ML_PROMOTION_MAX_ECE:-0.10}
      ML_PROMOTION_MIN_DELTA_SHARPE: ${ML_PROMOTION_MIN_DELTA_SHARPE:-0.00}
      ML_PROMOTION_MAX_FALSE_AVOID_RATE: ${ML_PROMOTION_MAX_FALSE_AVOID_RATE:-0.35}
      ML_PROMOTION_REQUIRED_HEALTHY_DAYS: ${ML_PROMOTION_REQUIRED_HEALTHY_DAYS:-7}
      ML_PROMOTION_REQUIRE_OPERATOR_APPROVAL: ${ML_PROMOTION_REQUIRE_OPERATOR_APPROVAL:-true}
      ML_PROMOTION_MAX_MISSED_WINNER_RATE: ${ML_PROMOTION_MAX_MISSED_WINNER_RATE:-0.50}
      ML_CAN_AFFECT_TRADES: ${ML_CAN_AFFECT_TRADES:-false}
      ENGINE_B_MODE: ${ENGINE_B_MODE:-LEGACY}
      ENGINE_B_MIN_SHADOW_DAYS: ${ENGINE_B_MIN_SHADOW_DAYS:-60}
      ENGINE_B_KILL_SHARPE: ${ENGINE_B_KILL_SHARPE:--1.0}
      ENGINE_B_KILL_DD_PCT: ${ENGINE_B_KILL_DD_PCT:--15.0}
      ENGINE_B_OPERATOR_APPROVAL: ${ENGINE_B_OPERATOR_APPROVAL:-false}
      # Phase B/E/F/F.1/G research-layer flags (default OFF; toggled
      # via .env for local enablement).
      RESEARCH_RO_ENABLED: ${RESEARCH_RO_ENABLED:-false}
      RESEARCH_MANUAL_RUN_ENABLED: ${RESEARCH_MANUAL_RUN_ENABLED:-false}
      # Phase 16 v1 — intraday context overlay (ephemeral, see
      # docs/research/INTRADAY_CONTEXT_OVERLAY.md). Default OFF.
      INTRADAY_OVERLAY_ENABLED: ${INTRADAY_OVERLAY_ENABLED:-false}
      # Phase 16 Phase 2 — intraday ML shadow data collection
      # (durable; see docs/research/INTRADAY_ML_SHADOW.md). Default OFF.
      # When True, market-tape poller writes one row per 15-min slot
      # per active recommendation to `intraday_observation`.
      INTRADAY_ML_SHADOW_ENABLED: ${INTRADAY_ML_SHADOW_ENABLED:-false}
      RESEARCH_AUTO_ENFORCEMENT_ENABLED: ${RESEARCH_AUTO_ENFORCEMENT_ENABLED:-false}
      RESEARCH_PREMIUM_TIER: ${RESEARCH_PREMIUM_TIER:-free}
      RESEARCH_ALLOWED_OPERATORS: ${RESEARCH_ALLOWED_OPERATORS:-}
      RESEARCH_ALLOWED_PROVIDERS: ${RESEARCH_ALLOWED_PROVIDERS:-mock}
      RESEARCH_ADMIN_TOKEN: ${RESEARCH_ADMIN_TOKEN:-}
      RESEARCH_LOCAL_TEST_MODE: ${RESEARCH_LOCAL_TEST_MODE:-false}
      AUTH_DISABLED_LOCAL: ${AUTH_DISABLED_LOCAL:-false}
      RESEARCH_GRACE_ENABLED: ${RESEARCH_GRACE_ENABLED:-false}
      OPTIONS_SHADOW_EVAL_ENABLED: ${OPTIONS_SHADOW_EVAL_ENABLED:-false}
      # Phase Opt-B3a — options master flag (default OFF). Even when
      # True, discipline gates (paper-only lock, no exec wrapper)
      # prevent live trading.
      OPTIONS_ENABLED: ${OPTIONS_ENABLED:-false}
      # P6D.1 staging — canary universe. Selector keys off this setting, NOT
      # the portfolio.universe column. Promotion gate stays
      # OPTIONS_CANARY_ENABLED unset→false (inert).
      OPTIONS_CANARY_UNIVERSE: ${OPTIONS_CANARY_UNIVERSE:-SPY}
      # P6D.4 parity — generator taxonomy (mirror worker-tickloop/worker-cron).
      # api does not run candidate generation; declared for cross-service parity.
      OPTIONS_GENERATOR_STRUCTURES: ${OPTIONS_GENERATOR_STRUCTURES:-directional}
      # Phase Opt-B3a — provider abstraction. Adapter chosen at
      # chain_ingest._build_adapter() per this value.
      # P6D.36A — default harmonized to 'tradier' across api /
      # worker-tickloop / worker-cron (was thetadata/thetadata/tradier;
      # drift caused the P6D.16 cron-ingest break). .env sets the real
      # value; this default only matters when the key is absent, and
      # tradier is the adapter that works without OPRA access.
      OPTIONS_DATA_PROVIDER: ${OPTIONS_DATA_PROVIDER:-tradier}
      # Phase Opt-B3a — Finnhub key (also used by catalysts pipeline).
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      # Phase Opt-B3a — Tradier sandbox/prod options provider.
      # Token loaded from .env; never embedded in any URL (adapter
      # uses Authorization: Bearer header). When empty, adapter
      # graceful-degrades to partial=True without raising.
      TRADIER_BASE_URL: ${TRADIER_BASE_URL:-https://sandbox.tradier.com/v1}
      TRADIER_ACCESS_TOKEN: ${TRADIER_ACCESS_TOKEN:-}
      TRADIER_TIMEOUT_SECONDS: ${TRADIER_TIMEOUT_SECONDS:-15}
      TRADIER_RATE_LIMIT_QPS: ${TRADIER_RATE_LIMIT_QPS:-1.0}
      TRADIER_DTE_WINDOW_DAYS: ${TRADIER_DTE_WINDOW_DAYS:-60}
      SAFE_GATE_EVOLUTION_PILOT_EXECUTION: ${SAFE_GATE_EVOLUTION_PILOT_EXECUTION:-false}
      # Market Events providers — empty defaults preserve graceful empty
      # arrays when keys not set. SEC EDGAR is free; UA optional override.
      SEC_EDGAR_USER_AGENT: ${SEC_EDGAR_USER_AGENT:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      BENZINGA_API_KEY: ${BENZINGA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
    volumes:
      - worker_cron_tmp:/var/scheduler_markers:ro
      # Read-only mount of paper-trading skip JSONL artifacts so the
      # /api/performance/paper/pending-fills endpoint can see them.
      # Operator-written by run_paper_daily_safe outside the container.
      - ../../artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health').read(); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend

  # Intraday + nightly DB-backed scheduler. Drives job_schedule table —
  # responsible for ingest_prices_daily, fetch_news, regime/factor
  # snapshots etc. Runs Python tick-loop.
  worker-tickloop:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "apps.worker.src.main"]
    environment:
      TZ: ${TZ:-America/New_York}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/New_York}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TIINGO_API_KEY: ${TIINGO_API_KEY}
      # Phase 11W follow-up — run_engine_pipeline.py calls
      # backfill_macro_features which requires FRED_API_KEY. Without
      # this propagation the daily loop's macro_backfill stage exits
      # rc=2, downstream stages skip, and context_daily / regime /
      # factor / candidate stay stuck behind price_bar.
      FRED_API_KEY: ${FRED_API_KEY}
      FERNET_KEY: ${FERNET_KEY}
      APP_VERSION: ${APP_VERSION:-0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 2026-05-29 — TEMPORARY: suppress flat max-hold exits in live
      # scheduled run_paper_exit_cycle until signal-aware max-hold is
      # promoted (Phase D). 999 = effectively no max-hold close; TP=8%
      # and SL=4% closes still fire. Revert to 10 (or unset) when
      # signal-aware max-hold goes live. See exit-policy research.
      PAPER_MAX_HOLD_DAYS: ${PAPER_MAX_HOLD_DAYS:-999}
      # Phase Opt-B3a Step 6a — worker tickloop fires options_*
      # scheduled jobs and needs identical OPTIONS_*/TRADIER_*
      # env shape as the api service so wrapper gating + adapter
      # config resolve identically. All defaults are inert/safe so
      # missing .env keys do not change behavior.
      OPTIONS_ENABLED: ${OPTIONS_ENABLED:-false}
      OPTIONS_SHADOW_EVAL_ENABLED: ${OPTIONS_SHADOW_EVAL_ENABLED:-false}
      # P6D.1 staging — canary universe (selector reads this, not the portfolio
      # column). Gate stays OPTIONS_CANARY_ENABLED unset→false.
      OPTIONS_CANARY_UNIVERSE: ${OPTIONS_CANARY_UNIVERSE:-SPY}
      # P6D.36A — default harmonized to 'tradier' (see api service note).
      OPTIONS_DATA_PROVIDER: ${OPTIONS_DATA_PROVIDER:-tradier}
      # Phase 4 — generator output taxonomy. Default-safe: absent .env key
      # → 'directional' (legacy). Set OPTIONS_GENERATOR_STRUCTURES=both in
      # .env to emit research + engine-compatible families.
      OPTIONS_GENERATOR_STRUCTURES: ${OPTIONS_GENERATOR_STRUCTURES:-directional}
      # Phase C Stage 2A — persist materialized candidate legs. Default OFF.
      # Pure persistence; no qualification/scoring/ranking/wing-width change.
      OPTIONS_PERSIST_LEGS: ${OPTIONS_PERSIST_LEGS:-false}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TRADIER_BASE_URL: ${TRADIER_BASE_URL:-https://sandbox.tradier.com/v1}
      TRADIER_ACCESS_TOKEN: ${TRADIER_ACCESS_TOKEN:-}
      TRADIER_TIMEOUT_SECONDS: ${TRADIER_TIMEOUT_SECONDS:-15}
      TRADIER_RATE_LIMIT_QPS: ${TRADIER_RATE_LIMIT_QPS:-1.0}
      TRADIER_DTE_WINDOW_DAYS: ${TRADIER_DTE_WINDOW_DAYS:-60}
    volumes:
      # 2026-05-08 trust fix — paper-trading skip JSONLs written by
      # run_paper_trading must persist on host so post-ingest cycle
      # (in worker-cron) and read-only API surface (in api) all see
      # the same artifacts. Without this mount, writes go to ephemeral
      # container fs and disappear on recreate, leaving a stale host
      # JSONL as the only visible record. Mount is RW: this container
      # is the writer.
      - ../../artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    # P6D.36A — liveness: tick_loop touches WORKER_HEARTBEAT_FILE every
    # iteration (60s). Stale mtime > 180s (3 missed ticks) = unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p=os.environ.get('WORKER_HEARTBEAT_FILE','/tmp/worker_heartbeat'); sys.exit(0 if time.time()-os.stat(p).st_mtime<180 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - backend

  # Daily orchestrator — supercronic fires /app/scripts/run_daily_loop.sh
  # 03:30 ET Tue-Sat. Independent of tickloop.
  worker-cron:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TIINGO_API_KEY: ${TIINGO_API_KEY}
      # Phase 11W follow-up — run_engine_pipeline.py calls
      # backfill_macro_features which requires FRED_API_KEY. Without
      # this propagation the daily loop's macro_backfill stage exits
      # rc=2, downstream stages skip, and context_daily / regime /
      # factor / candidate stay stuck behind price_bar.
      FRED_API_KEY: ${FRED_API_KEY}
      FERNET_KEY: ${FERNET_KEY}
      APP_VERSION: ${APP_VERSION:-0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Phase C Stage 2A — persist materialized candidate legs. Default OFF.
      OPTIONS_PERSIST_LEGS: ${OPTIONS_PERSIST_LEGS:-false}
      # P6B.6 env parity — worker-cron shares the job_schedule tick-loop with
      # worker-tickloop; without these flags a cron-claimed options_shadow_eval
      # ran in dry-mode (persist=False) → 0 shadow rows. Mirror tickloop/api.
      OPTIONS_ENABLED: ${OPTIONS_ENABLED:-false}
      OPTIONS_SHADOW_EVAL_ENABLED: ${OPTIONS_SHADOW_EVAL_ENABLED:-false}
      # P6D.1 staging — canary universe (selector reads this, not the portfolio
      # column). Gate stays OPTIONS_CANARY_ENABLED unset→false.
      OPTIONS_CANARY_UNIVERSE: ${OPTIONS_CANARY_UNIVERSE:-SPY}
      # P6D.4 fix — generator output taxonomy parity (mirror worker-tickloop).
      # Missing here → defaults 'directional' → credit pass (SPCS/IC) skipped
      # whenever worker-cron claims candidate generation. .env sets 'both'.
      OPTIONS_GENERATOR_STRUCTURES: ${OPTIONS_GENERATOR_STRUCTURES:-directional}
      # P6D.16 fix — data-provider parity (mirror api/worker-tickloop).
      # P6D.36A — all three services now share this 'tradier' default.
      OPTIONS_DATA_PROVIDER: ${OPTIONS_DATA_PROVIDER:-tradier}
      ML_HYBRID_ENABLED: ${ML_HYBRID_ENABLED:-false}
      ML_HYBRID_MODE: ${ML_HYBRID_MODE:-advisory}
      ML_HYBRID_REQUIRE_CALIBRATION: ${ML_HYBRID_REQUIRE_CALIBRATION:-true}
      ML_HYBRID_REQUIRE_BASELINE_BEAT: ${ML_HYBRID_REQUIRE_BASELINE_BEAT:-true}
      ML_HYBRID_ALLOW_BLOCK: ${ML_HYBRID_ALLOW_BLOCK:-false}
      ML_HYBRID_MIN_CONFIDENCE: ${ML_HYBRID_MIN_CONFIDENCE:-0.65}
      ML_HYBRID_MAX_STALE_DAYS: ${ML_HYBRID_MAX_STALE_DAYS:-7}
      ML_HYBRID_MIN_DATA_CONFIDENCE: ${ML_HYBRID_MIN_DATA_CONFIDENCE:-0.70}
      ML_HYBRID_MIN_MULTIPLIER: ${ML_HYBRID_MIN_MULTIPLIER:-0.50}
      ML_PROMOTION_MIN_ADVICE: ${ML_PROMOTION_MIN_ADVICE:-20}
      ML_PROMOTION_MIN_OUTCOMES: ${ML_PROMOTION_MIN_OUTCOMES:-20}
      ML_PROMOTION_MAX_ECE: ${ML_PROMOTION_MAX_ECE:-0.10}
      ML_PROMOTION_MIN_DELTA_SHARPE: ${ML_PROMOTION_MIN_DELTA_SHARPE:-0.00}
      ML_PROMOTION_MAX_FALSE_AVOID_RATE: ${ML_PROMOTION_MAX_FALSE_AVOID_RATE:-0.35}
      ML_PROMOTION_REQUIRED_HEALTHY_DAYS: ${ML_PROMOTION_REQUIRED_HEALTHY_DAYS:-7}
      ML_PROMOTION_REQUIRE_OPERATOR_APPROVAL: ${ML_PROMOTION_REQUIRE_OPERATOR_APPROVAL:-true}
      ML_PROMOTION_MAX_MISSED_WINNER_RATE: ${ML_PROMOTION_MAX_MISSED_WINNER_RATE:-0.50}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/New_York}
      ML_CAN_AFFECT_TRADES: ${ML_CAN_AFFECT_TRADES:-false}
      # 2026-05-29 — TEMPORARY max-hold suppression (mirror of
      # worker-tickloop). Keeps exit policy identical whichever worker
      # fires the cycle. Revert to 10 when signal-aware max-hold ships.
      PAPER_MAX_HOLD_DAYS: ${PAPER_MAX_HOLD_DAYS:-999}
    volumes:
      # Persist /tmp health markers so API + host can read them
      - worker_cron_tmp:/tmp
      # 2026-05-08 trust fix — sibling mount to worker-tickloop so
      # run_post_ingest_paper_cycle can read existing skip JSONLs and
      # write `.replayed.jsonl` markers. RW because the cycle is the
      # one process that mutates marker state.
      - ../../artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    # P6D.36A — worker-cron runs the same tick-loop image/CMD, so the
    # same heartbeat liveness check applies. Heartbeat lands in the
    # worker_cron_tmp volume (/tmp) — persistence across restarts is
    # fine: mtime freshness, not existence, is the health signal.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p=os.environ.get('WORKER_HEARTBEAT_FILE','/tmp/worker_heartbeat'); sys.exit(0 if time.time()-os.stat(p).st_mtime<180 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - backend

  # Vite dev server for the React frontend. Bind-mounts apps/web so
  # source edits hot-reload via Vite's polling watcher (Windows-safe;
  # polling configured in apps/web/vite.config.ts). node_modules is a
  # named volume so the Linux container's install survives independent
  # of the host's Windows-built modules.
  #
  # Soft `depends_on` (no condition) lets Learn-only routes load even
  # when the API is still booting; Today/Pick/Portfolio routes will
  # show their normal loading/error state until /api is healthy.
  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      # Chokidar polling (Vite watch) — required for bind-mount file
      # events to propagate from Windows host into Linux container.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Vite proxies /api to the api service over the compose network.
      VITE_API_PROXY_TARGET: "http://api:8000"
    command: sh -c "npm install --no-audit --no-fund --silent && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../../apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    # P6D.36A — Vite dev server liveness. busybox wget ships in
    # node:20-alpine. 127.0.0.1 (not localhost): alpine resolves
    # localhost to ::1 first and Vite binds IPv4 0.0.0.0 only.
    # Long start_period: first boot runs npm install.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - backend

volumes:
  pgdata:
    driver: local
  worker_cron_tmp:
    driver: local
  web_node_modules:
    driver: local

networks:
  backend:
    driver: bridge
