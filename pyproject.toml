[project]
name = "investment-platform"
version = "0.1.0"
description = "Personal investment-intelligence platform – Phase 0 backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pandas-ta>=0.3.14b",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "cryptography>=42.0.5",
    "tenacity>=8.3.0",
    "croniter>=2.0.5",
]

[project.scripts]
api    = "apps.api.src.main:main"
worker = "apps.worker.src.main:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "scripts"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0.20240316",
    "testcontainers[postgres]>=4.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore  = ["E501"]

[tool.ruff.isort]
known-first-party = ["apps"]

[tool.mypy]
python_version     = "3.12"
strict             = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["apps/api/tests", "apps/worker/tests"]
markers      = [
    "integration: requires Docker (Postgres via testcontainers). Run with '-m integration'.",
]
